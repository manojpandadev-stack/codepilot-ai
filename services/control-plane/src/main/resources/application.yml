server:
  port: 8081

spring:
  application:
    name: codepilot-control-plane

  datasource:
    url: jdbc:postgresql://localhost:5433/codepilot
    username: codepilot
    password: codepilot
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      write-dates-as-timestamps: false

codepilot:
  auth:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration: 86400000

logging:
  level:
    com.codepilot: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
