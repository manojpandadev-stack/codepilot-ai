name: CodePilot AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typescript-build:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only --fetch-retries=5 --fetch-timeout=120000

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Run all tests
        run: pnpm exec vitest run

      - name: Build all packages
        run: pnpm build:packages

  java-build:
    name: Java Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: cd services/control-plane && mvn clean verify -B

  extension-build:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only --fetch-retries=5 --fetch-timeout=120000

      - name: Build TypeScript packages
        run: pnpm build:packages

      - name: Build webview
        run: cd apps/webview && npx vite build

      - name: Build extension
        run: |
          cd apps/vscode-extension
          node esbuild.mjs

      - name: Package VSIX
        run: |
          cd apps/vscode-extension
          npx @vscode/vsce package --no-dependencies --allow-missing-repository --skip-license

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepilot-ai-vsix
          path: apps/vscode-extension/*.vsix

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build control plane
        run: docker compose build control-plane

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only --fetch-retries=5 --fetch-timeout=120000

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Check no type errors
        run: pnpm -r typecheck

      - name: Check formatting
        run: pnpm exec prettier --check "packages/*/src/**/*.ts" "apps/*/src/**/*.ts" "apps/webview/src/**/*.{ts,tsx}"
